name: Maison IA tests
on:
  push:
    branches: [maison-ia-v1]
    paths: ['maison-ia/**', 'render.yaml', '.github/workflows/maison-ia.yml']
  pull_request:
    paths: ['maison-ia/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: maison-ia/requirements.lock
      - run: pip install -r requirements.lock
        working-directory: maison-ia
      - run: pytest -q
        working-directory: maison-ia
